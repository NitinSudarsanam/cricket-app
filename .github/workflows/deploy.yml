name: Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Check code quality
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cricket-app/package-lock.json

      - name: Install dependencies
        working-directory: cricket-app
        run: npm ci

      - name: Run TypeScript check
        working-directory: cricket-app
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: cricket-app
        run: npm test

      - name: Generate coverage report
        working-directory: cricket-app
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: cricket-app/coverage/
          retention-days: 30

      - name: Run security audit
        working-directory: cricket-app
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Run production readiness check
        working-directory: cricket-app
        run: npm run check:prod

  # Job 2: Build and test
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cricket-app/package-lock.json

      - name: Install dependencies
        working-directory: cricket-app
        run: npm ci

      - name: Generate Prisma Client
        working-directory: cricket-app
        run: npm run db:generate

      - name: Build application
        working-directory: cricket-app
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
          PUSHER_KEY: ${{ secrets.PUSHER_KEY }}
          PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
          PUSHER_CLUSTER: ${{ secrets.PUSHER_CLUSTER }}
          NEXT_PUBLIC_PUSHER_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}

      - name: Analyze bundle size
        working-directory: cricket-app
        run: npm run analyze

  # Job 3: E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cricket-app/package-lock.json

      - name: Install dependencies
        working-directory: cricket-app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: cricket-app
        run: npx playwright install --with-deps

      - name: Setup test database
        working-directory: cricket-app
        run: |
          npm run db:generate
          npm run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed E2E test data
        working-directory: cricket-app
        run: tsx e2e/seed.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run E2E tests
        working-directory: cricket-app
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: cricket-app/playwright-report/
          retention-days: 30

  # Job 4: Deploy to Vercel (only on main branch)
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: cricket-app
          vercel-args: '--prod'

      - name: Comment deployment URL
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Deployed to production successfully!'
            })
